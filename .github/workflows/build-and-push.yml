name: Build and Push API

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::879366471942:role/ZenvyGithubActionsRole
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/zenvy/backend:latest \
            .
      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/zenvy/backend:latest

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0b558f42bb54aefcb \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 879366471942.dkr.ecr.us-east-2.amazonaws.com", "cd /home/ubuntu/zenvy-backend", "docker compose -f docker-compose.prod.yml pull", "docker compose -f docker-compose.prod.yml up -d", "docker compose -f docker-compose.prod.yml ps --status running"]' \
            --region us-east-2 \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command ID: $COMMAND_ID"
          
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0b558f42bb54aefcb
          
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0b558f42bb54aefcb \
            --query "StandardOutputContent" \
            --output text